{% extends "base.html" %}
{% block content %}

<h3 class="mb-4">Editar cliente</h3>

<a href="/clientes/{{ cliente.id_cliente }}" class="btn btn-outline-secondary mb-3">
    ← Volver al detalle
</a>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ request.session.get('_csrf_token', '') }}">

            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text"
                       name="nombre_completo"
                       class="form-control"
                       value="{{ cliente.nombre_completo }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text"
                       name="telefono"
                       class="form-control"
                       value="{{ cliente.telefono }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono de emergencia</label>
                <input type="text"
                       name="telefono_emergencia"
                       class="form-control"
                       value="{{ cliente.telefono_emergencia }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Nota médica</label>
                <textarea name="nota_medica"
                          class="form-control"
                          rows="3">{{ cliente.nota_medica }}</textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select">
                    <option value="1" {% if cliente.estado %}selected{% endif %}>
                        Activo
                    </option>
                    <option value="0" {% if not cliente.estado %}selected{% endif %}>
                        Inactivo
                    </option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark">
                    Guardar cambios
                </button>
                <a href="/clientes/{{ cliente.id_cliente }}"
                   class="btn btn-outline-secondary">
                    Cancelar
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
