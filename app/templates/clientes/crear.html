{% extends "base.html" %}
{% block content %}

<h3 class="mb-3">Nuevo cliente</h3>

<form method="post" class="card shadow-sm p-4">
    <input type="hidden" name="_csrf_token" value="{{ request.session.get('_csrf_token', '') }}">

    <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" name="nombre_completo" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono de emergencia</label>
        <input type="text" name="telefono_emergencia" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Nota médica</label>
        <textarea name="nota_medica" class="form-control" rows="3"></textarea>
    </div>

    <div class="d-flex justify-content-end">
        <button class="btn btn-primary">Crear cliente</button>
        <a href="/clientes" class="btn btn-secondary ms-2">Cancelar</a>
    </div>

</form>

{% endblock %}
