{% extends "base.html" %}
{% block content %}

<h3 class="mb-3">Editar coach</h3>

<form method="post" class="card shadow-sm p-4">
    <input type="hidden" name="_csrf_token" value="{{ request.session.get('_csrf_token', '') }}">

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text"
               name="nombre"
               class="form-control"
               value="{{ coach.nombre }}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text"
               name="telefono"
               class="form-control"
               value="{{ coach.telefono }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Estado</label>
        <select name="activo" class="form-select">
            <option value="1" {% if coach.activo %}selected{% endif %}>
                Activo
            </option>
            <option value="0" {% if not coach.activo %}selected{% endif %}>
                Inactivo
            </option>
        </select>
    </div>

    <button class="btn btn-primary">Guardar cambios</button>
    <a href="/coaches" class="btn btn-secondary ms-2">Cancelar</a>

</form>

{% endblock %}
