{% extends "base.html" %}
{% block content %}

<a href="/descuentos" class="btn btn-outline-secondary mb-4">
    ← Volver a descuentos
</a>

<h3 class="mb-3">
    {% if descuento %}Editar{% else %}Nuevo{% endif %} descuento
</h3>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post"
              action="{% if descuento %}
                      /descuentos/actualizar/{{ descuento.id_descuento }}
                      {% else %}
                      /descuentos/crear
                      {% endif %}">
    <input type="hidden" name="_csrf_token" value="{{ request.session.get('_csrf_token', '') }}">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text"
                       name="nombre"
                       class="form-control"
                       required
                       value="{{ descuento.nombre if descuento else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Porcentaje</label>
                <input type="number"
                       name="porcentaje"
                       step="0.01"
                       class="form-control"
                       required
                       value="{{ descuento.porcentaje if descuento else '' }}">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox"
                       class="form-check-input"
                       id="activo"
                       name="activo"
                       value="1"
                       {% if descuento is none or descuento.activo %}checked{% endif %}>
                <label class="form-check-label" for="activo">Activo</label>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="/descuentos" class="btn btn-secondary">
                    Cancelar
                </a>
                <button class="btn btn-dark">
                    Guardar
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
