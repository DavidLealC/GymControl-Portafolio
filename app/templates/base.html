<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GymControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root { color-scheme: light; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            font-size: 0.95rem;
        }
        h1, h2, h3, h4, h5, .brand-title {
            font-family: "Oswald", "Segoe UI", sans-serif;
        }
        .site-navbar { min-height: 68px; }
        .brand-mark {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 46px;
            overflow: hidden;
        }
        .brand-mark svg { display: block; width: 46px; height: 46px; }
        .brand-title { font-size: 1.35rem; letter-spacing: .015em; }
        .content-area { min-width: 0; }
        .card { border: 1px solid rgba(16, 24, 40, .09); border-radius: .6rem; overflow: hidden; }
        .table { vertical-align: middle; }
        .table thead th { font-size: .875rem; font-weight: 600; white-space: nowrap; }
        .table tbody td { padding-top: .75rem; padding-bottom: .75rem; }
        .table .badge { font-weight: 600; }
        .page-actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
        .form-control:focus, .form-select:focus { box-shadow: 0 0 0 .2rem rgba(13,110,253,.16); }
        @media (max-width: 575.98px) {
            .brand-title { font-size: 1.1rem; }
            .brand-mark, .brand-mark svg { width: 38px; height: 38px; }
            .brand-mark { flex-basis: 38px; }
            .site-navbar { min-height: 62px; }
            .table { font-size: .875rem; }
        }
    </style>
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black shadow-sm site-navbar">
    <div class="container d-flex align-items-center justify-content-between gap-3">

        <a class="navbar-brand d-flex align-items-center fw-bold mb-0"
               href="/">
                <span class="brand-title">GymControl</span>
            </a>

        <form method="post" action="/logout" class="m-0 flex-shrink-0">
            <input type="hidden" name="_csrf_token" value="{{ request.session.get('_csrf_token', '') }}">
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
    </div>
</nav>

<main class="container py-4 content-area">
    {% block content %}{% endblock %}
</main>

</body>
</html>
