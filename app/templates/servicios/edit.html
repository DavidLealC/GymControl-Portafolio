{% extends "base.html" %}
{% block content %}

<a href="/servicios/" class="btn btn-outline-secondary mb-4">
    Volver a servicios
</a>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Editar Servicio</h3>
</div>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ request.session.get('_csrf_token', '') }}">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" value="{{ servicio.nombre }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" name="descripcion" rows="3">{{ servicio.descripcion }}</textarea>
            </div>

            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="incluye_pesas" value="true" id="pesas" {% if servicio.incluye_pesas %}checked{% endif %}>
                <label class="form-check-label" for="pesas">Incluye Gym</label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="incluye_clase_diaria" value="true" id="clase_diaria" {% if servicio.incluye_clase_diaria %}checked{% endif %}>
                <label class="form-check-label" for="clase_diaria">Incluye Clase Diaria</label>
            </div>

            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </form>

    </div>
</div>

{% endblock %}
