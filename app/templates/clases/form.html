{% extends "base.html" %}
{% block content %}

<a href="/clases/" class="btn btn-outline-secondary mb-4">
    ← Volver a clases
</a>

<h3 class="mb-3">
    {% if clase %}
        Editar clase
    {% else %}
        Nueva clase
    {% endif %}
</h3>

<div class="card shadow-sm">
    <div class="card-body">

        <form
            method="post"
            action="{% if clase %}/clases/{{ clase.id_clase }}/editar{% else %}/clases/nuevo{% endif %}"
        >
    <input type="hidden" name="_csrf_token" value="{{ request.session.get('_csrf_token', '') }}">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    value="{{ clase.nombre if clase else '' }}"
                    required
                >
            </div>

            {% if clase %}
            <div class="form-check mb-3">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="activo"
                    {% if clase.activo %}checked{% endif %}
                >
                <label class="form-check-label">
                    Clase activa
                </label>
            </div>

            {% endif %}

            <div class="d-flex justify-content-end gap-2">
                <a href="/clases/" class="btn btn-secondary">
                    Cancelar
                </a>
                <button class="btn btn-dark">
                    {% if clase %}Guardar cambios{% else %}Guardar{% endif %}
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
