<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<form method="post" class="card p-4" style="width:300px;">
    <input type="hidden" name="_csrf_token" value="{{ request.session.get('_csrf_token', '') }}">
    <h4 class="text-center mb-3">Iniciar sesión</h4>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <input name="usuario" class="form-control mb-2" placeholder="Usuario">
    <input name="password" type="password" class="form-control mb-3" placeholder="Contraseña">

    <button class="btn btn-primary w-100">Entrar</button>
</form>

</body>
</html>
